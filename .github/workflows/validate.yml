name: Validate Web Technology Lab Submission

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      allow_protected_changes:
        description: "Instructor-only: allow changes to workflow or validator files"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ALLOW_PROTECTED_CHANGES: ${{ github.event.inputs.allow_protected_changes || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Validate submission
        run: python3 .github/scripts/validate_submission.py
